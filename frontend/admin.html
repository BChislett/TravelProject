<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Journey - Admin</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .form-section {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .locations-list {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .location-item {
            background: var(--bg-dark);
            padding: 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .location-info h3 {
            margin: 0 0 0.5rem 0;
            color: var(--accent-color);
        }

        .location-info p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .location-actions {
            display: flex;
            gap: 0.5rem;
        }

        .photo-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 0.5rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .photo-upload-area:hover {
            border-color: var(--primary-color);
            background: var(--bg-dark);
        }

        .photo-upload-area.dragover {
            border-color: var(--accent-color);
            background: var(--bg-dark);
        }

        .photo-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .photo-preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .photo-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-remove {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-message {
            background: var(--success-color);
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .error-message {
            background: #ef4444;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="admin-container">
            <div class="admin-header">
                <h1 style="margin: 0;">Manage Locations</h1>
                <a href="/" class="btn btn-secondary">View Journey</a>
            </div>

            <div id="success-message" class="success-message"></div>
            <div id="error-message" class="error-message"></div>

            <div class="form-section">
                <h2>Add New Location</h2>
                <form id="location-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Location Name *</label>
                            <input type="text" id="name" name="name" required placeholder="e.g., Paris">
                        </div>
                        <div class="form-group">
                            <label for="country">Country *</label>
                            <input type="text" id="country" name="country" required placeholder="e.g., France">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="lat">Latitude *</label>
                            <input type="number" id="lat" name="lat" step="0.000001" required placeholder="e.g., 48.8566">
                        </div>
                        <div class="form-group">
                            <label for="lng">Longitude *</label>
                            <input type="number" id="lng" name="lng" step="0.000001" required placeholder="e.g., 2.3522">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="arrivalDate">Arrival Date *</label>
                            <input type="date" id="arrivalDate" name="arrivalDate" required>
                        </div>
                        <div class="form-group">
                            <label for="departureDate">Departure Date *</label>
                            <input type="date" id="departureDate" name="departureDate" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" placeholder="Share your memories and experiences..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="transportToNext">Transport to Next Location</label>
                        <select id="transportToNext" name="transportToNext">
                            <option value="flight">Flight ✈️</option>
                            <option value="train">Train 🚂</option>
                            <option value="car">Car 🚗</option>
                            <option value="bus">Bus 🚌</option>
                            <option value="boat">Boat ⛵</option>
                            <option value="walk">Walk 🚶</option>
                            <option value="bike">Bike 🚴</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tags">Tags (comma-separated)</label>
                        <input type="text" id="tags" name="tags" placeholder="e.g., city, culture, food">
                    </div>

                    <div class="form-group">
                        <label>Photos</label>
                        <div class="photo-upload-area" id="photo-upload-area">
                            <p>📸 Click or drag photos here to upload</p>
                            <input type="file" id="photo-input" accept="image/*" multiple style="display: none;">
                        </div>
                        <div class="photo-preview" id="photo-preview"></div>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Location</button>
                </form>
            </div>

            <div class="locations-list">
                <h2>Existing Locations</h2>
                <div id="locations-list-container">
                    <!-- Locations will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/admin.js"></script>
</body>
</html>
